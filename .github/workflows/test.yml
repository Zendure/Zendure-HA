name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements_test.txt
      - name: Run pytest
        run: |
          pytest --verbose
